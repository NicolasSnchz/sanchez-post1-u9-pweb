# Flujo temporal: arranca la aplicacion con MySQL, la recorre en un navegador real y publica la
# evidencia en la rama evidencias. Se retira cuando la evidencia queda en el repositorio.
name: Evidencias

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: seguridad_db
          MYSQL_USER: appuser
          MYSQL_PASSWORD: appuser123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot123"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            23
            17
          cache: maven
      - name: Herramientas del navegador
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xterm xvfb x11-utils imagemagick jq > /dev/null
          cd "$RUNNER_TEMP" && npm install --silent playwright@1.49.1 && npx playwright install --with-deps chromium > /dev/null
      - name: Medir y capturar
        run: bash .github/evidencias/medir.sh
      - name: Publicar en la rama evidencias
        if: always()
        run: |
          cd evid
          git init -q -b evidencias
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Evidencias de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" evidencias
