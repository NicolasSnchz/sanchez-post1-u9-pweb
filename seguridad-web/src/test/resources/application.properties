# Pruebas: H2 en memoria en modo MySQL, sin depender de un servidor
spring.datasource.url=jdbc:h2:mem:seguridad;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=clave-de-las-pruebas-automaticas-de-al-menos-32-bytes
jwt.expiracion-ms=3600000
