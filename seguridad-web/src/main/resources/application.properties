spring.application.name=seguridad

# MySQL: las credenciales se leen de variables de entorno (con valores de desarrollo por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seguridad_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: la clave se lee de la variable de entorno JWT_SECRET. El valor por defecto solo sirve para
# desarrollo local; en produccion JWT_SECRET es obligatoria (ver README)
jwt.secret=${JWT_SECRET:clave-de-desarrollo-local-solo-para-el-laboratorio-u9}
jwt.expiracion-ms=${JWT_EXPIRACION_MS:3600000}
