<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<main>
  <div class="tarjeta angosta">
    <h1>Crear cuenta</h1>
    <form th:action="@{/registro}" th:object="${usuario}" method="post">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" th:field="*{nombre}">
      <div class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>

      <label for="email">Correo</label>
      <input type="email" id="email" th:field="*{email}">
      <div class="campo-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

      <label for="contrasenia">Contraseña</label>
      <input type="password" id="contrasenia" th:field="*{contrasenia}">
      <div class="campo-error" th:if="${#fields.hasErrors('contrasenia')}" th:errors="*{contrasenia}"></div>

      <button type="submit">Registrarse</button>
    </form>
    <p><a th:href="@{/login}">Ya tengo cuenta</a></p>
  </div>
</main>
</body>
</html>
